<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramyar_Brand</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1c1a17;--muted:#7a7469;--accent:#c1622f;--accent-text:#fff;--border:#e8e2d8;--danger:#c0392b;}
@media (prefers-color-scheme:dark){:root{--bg:#171512;--card:#221f1b;--text:#f2ede6;--muted:#a89f92;--accent:#e08a52;--accent-text:#1c1a17;--border:#332f29;--danger:#e0685a;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Kufi Arabic",Tahoma,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:var(--bg);border-bottom:1px solid var(--border);z-index:5}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:960px;margin:0 auto}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--muted);font-size:.85rem;margin:4px auto 0;max-width:960px}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:20px;padding:8px 16px;font-weight:600;font-size:.85rem;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
main{max-width:960px;margin:0 auto;padding:18px 16px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--border);display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font-size:1rem}.price{color:var(--accent);font-weight:700}
.desc{color:var(--muted);font-size:.82rem;line-height:1.5;flex:1}
.wa{margin-top:6px;background:#25D366;color:#fff;text-decoration:none;text-align:center;border-radius:10px;padding:9px;font-weight:600;font-size:.88rem}
.adm{position:absolute;top:8px;left:8px;display:flex;gap:6px}
.ib{background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;width:30px;height:30px;cursor:pointer}.ib.del{background:var(--danger)}
.msg{text-align:center;color:var(--muted);padding:60px 20px}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:20px;padding:14px 20px;font-size:.95rem;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.ownerBtn{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;z-index:6;opacity:.55}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:1.1rem}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 5px}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:.95rem}
textarea{min-height:70px;resize:vertical}
.acts{display:flex;gap:10px;margin-top:16px}.acts button{flex:1;padding:11px;border-radius:10px;border:0;font-weight:700;font-size:.9rem;font-family:inherit;cursor:pointer}
.ok{background:var(--accent);color:var(--accent-text)}.no{background:transparent;border:1px solid var(--border)!important;color:var(--text)}
.hidden{display:none!important}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:.85rem;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:960px;margin:12px auto 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:.85rem;font-family:inherit;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--accent)}
.chip .x{font-weight:400;opacity:.7;padding:0 2px}
.tag{color:var(--muted);font-size:.75rem}
#prev{display:none;width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <div class="row"><h1 id="sName">Ramyar_Brand</h1>
    <div style="display:flex;gap:8px"><button class="btn ghost hidden" id="setBtn">ڕێکخستن</button><button class="btn ghost hidden" id="outBtn">چوونەدەرەوە</button></div></div>
  <div class="sub" id="sSub"></div>
  <div class="chips" id="chips"></div>
</header>
<main><div class="msg" id="state">چاوەڕێ بکە...</div><div class="grid" id="grid"></div></main>

<button class="btn fab hidden" id="addBtn">＋ زیادکردنی بەرهەم</button>
<button class="btn ghost ownerBtn" id="loginBtn">خاوەن؟</button>
<div class="toast" id="toast"></div>

<div class="ov hidden" id="loginOv"><div class="sheet"><h2>چوونەژوورەوەی خاوەن</h2>
  <label>ئیمەیڵ</label><input id="lEmail" type="email" autocomplete="username">
  <label>وشەی نهێنی</label><input id="lPass" type="password" autocomplete="current-password">
  <div class="acts"><button class="no" data-close="loginOv">داخستن</button><button class="ok" id="lGo">چوونەژوورەوە</button></div></div></div>

<div class="ov hidden" id="formOv"><div class="sheet"><h2 id="fTitle">بەرهەمی نوێ</h2>
  <label>جۆری بەرهەم (لە پەڕەی سەرەکی بە «＋ جۆر» زیادی بکە)</label><select id="fCat"></select>
  <label>ناوی بەرهەم (ئارەزوومەندانە، ئەگەر بەتاڵ بێت ناوی جۆرەکە دەنووسرێت)</label><input id="fName">
  <label>نرخ</label><input id="fPrice" placeholder="25,000 دینار">
  <label>وێنە</label><input id="fFile" type="file" accept="image/*"><img id="prev" alt="">
  <label>وردەکاری (ئارەزوومەندانە)</label><textarea id="fDesc"></textarea>
  <div class="acts"><button class="no" data-close="formOv">پاشگەزبوونەوە</button><button class="ok" id="fSave">پاشەکەوتکردن</button></div></div></div>

<div class="ov hidden" id="setOv"><div class="sheet"><h2>ڕێکخستنی فرۆشگا</h2>
  <label>ناوی فرۆشگا</label><input id="stName">
  <label>ژێرنووس</label><input id="stSub">
  <label>ژمارەی واتساپ (بە کۆدی وڵات، نموونە: 9647501234567)</label><input id="stWa" inputmode="numeric">
  <div class="acts"><button class="no" data-close="setOv">داخستن</button><button class="ok" id="stSave">پاشەکەوتکردن</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient('https://ltuvnbimujiveydyuoov.supabase.co','sb_publishable_HUFbctOyrAU6IP88NJ89Qw_w08Qps60');
const $ = id => document.getElementById(id);
let settings = {store_name:'Ramyar_Brand',store_sub:'',whatsapp:''}, products = [], categories = [], activeCat = 'all', isOwner = false, editing = null, imgBlob = null, imgUrl = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function show(id){$(id).classList.remove('hidden')} function hide(id){$(id).classList.add('hidden')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));

function render(){
  $('sName').textContent = settings.store_name; document.title = settings.store_name;
  $('sSub').textContent = settings.store_sub || '';
  const wa = (settings.whatsapp||'').replace(/\D/g,'');
  const catName = id => (categories.find(c=>c.id===id)||{}).name || '';
  if(activeCat!=='all' && !categories.some(c=>c.id===activeCat)) activeCat='all';
  const shown = activeCat==='all' ? products : products.filter(p=>p.category_id===activeCat);
  const cnt = id => products.filter(p=>p.category_id===id).length;
  $('chips').classList.toggle('hidden', !categories.length && !isOwner);
  $('chips').innerHTML =
    (categories.length ? `<span class="chip ${activeCat==='all'?'on':''}" role="button" data-c="all">هەموو (${products.length})</span>` : '') +
    categories.map(c=>`<span class="chip ${activeCat===c.id?'on':''}" role="button" data-c="${c.id}">${esc(c.name)} (${cnt(c.id)})${isOwner?`<b class="x" data-xc="${c.id}">✕</b>`:''}</span>`).join('') +
    (isOwner ? `<span class="chip add" role="button" id="addCat">＋ جۆر</span>` : '');
  $('state').classList.toggle('hidden', shown.length>0);
  $('state').textContent = products.length ? 'هیچ بەرهەمێک لەم جۆرەدا نییە.' : 'هێشتا هیچ بەرهەمێک زیاد نەکراوە.';
  $('grid').innerHTML = shown.map(p => {
    const title = p.name || catName(p.category_id);
    return `
    <div class="card">
      ${isOwner ? `<div class="adm"><button class="ib" data-e="${p.id}">✎</button><button class="ib del" data-d="${p.id}">✕</button></div>` : ''}
      <img src="${esc(p.image_url)}" alt="${esc(title)}" loading="lazy">
      <div class="body"><h3>${esc(title)}</h3>
      ${p.name && catName(p.category_id) ? `<div class="tag">${esc(catName(p.category_id))}</div>` : ''}
      <div class="price">${esc(p.price)}</div>
      ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}
      ${wa ? `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent('سڵاو، دەمەوێت پرسیار لەسەر «'+title+'» بکەم')}">پەیوەندی بە واتساپ</a>` : ''}</div>
    </div>`}).join('');
  $('grid').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>openForm(b.dataset.e));
  $('grid').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>del(b.dataset.d));
}
$('chips').onclick = async e => {
  const x = e.target.closest('[data-xc]');
  if(x){ delCat(x.dataset.xc); return; }
  if(e.target.closest('#addCat')){ addCat(); return; }
  const c = e.target.closest('[data-c]'); if(c){ activeCat = c.dataset.c; render(); }
};
async function addCat(){
  const n = (prompt('ناوی جۆری نوێ (نموونە: پانتۆڵ)')||'').trim(); if(!n) return;
  const {error} = await sb.from('categories').insert({name:n});
  if(error){ toast('جۆرەکە زیاد نەکرا'); return; } await load(); toast('جۆرەکە زیاد کرا ✓');
}
async function delCat(id){
  if(!confirm('ئەم جۆرە دەسڕدرێتەوە. بەرهەمەکانی ناسڕدرێنەوە، تەنها بێ جۆر دەبن. دڵنیایت؟')) return;
  const {error} = await sb.from('categories').delete().eq('id',id);
  if(error){ toast('نەسڕایەوە'); return; } await load(); toast('سڕایەوە ✓');
}
function setOwner(v){
  isOwner = v;
  ['addBtn','setBtn','outBtn'].forEach(i=>$(i).classList.toggle('hidden',!v));
  $('loginBtn').classList.toggle('hidden',v); render();
}
async function load(){
  const [s,p,c] = await Promise.all([
    sb.from('settings').select('*').eq('id',1).maybeSingle(),
    sb.from('products').select('*').order('created_at',{ascending:false}),
    sb.from('categories').select('*').order('created_at',{ascending:true})]);
  if(s.error||p.error){ $('state').textContent='نەتوانرا بەرهەمەکان باربکرێن. دووبارە هەوڵبدەرەوە.'; return; }
  if(s.data) settings = s.data; products = p.data || []; categories = c.error ? [] : (c.data || []); render();
}

// login
$('loginBtn').onclick=()=>show('loginOv');
$('lGo').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPass').value});
  if(error){toast('ئیمەیڵ یان وشەی نهێنی هەڵەیە');return}
  hide('loginOv'); $('lPass').value=''; setOwner(true); toast('بەخێربێیت ✓');
};
$('outBtn').onclick=async()=>{await sb.auth.signOut(); setOwner(false)};

// image
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{
  const k=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.78)};i.onerror=rej;i.src=e.target.result};r.onerror=rej;r.readAsDataURL(file)})}
$('fFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{imgBlob=await compress(f);$('prev').src=URL.createObjectURL(imgBlob);$('prev').style.display='block'}catch{toast('وێنەکە نەکرایەوە')}};

// products
function openForm(id){
  editing = id||null; const p = id ? products.find(x=>x.id===id) : null;
  $('fTitle').textContent = id?'دەستکاریکردنی بەرهەم':'بەرهەمی نوێ';
  $('fCat').innerHTML='<option value="">— بێ جۆر —</option>'+categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''); $('fCat').value=p?.category_id||''; $('fName').value=p?p.name:''; $('fPrice').value=p?.price||''; $('fDesc').value=p?.description||'';
  $('fFile').value=''; imgBlob=null; imgUrl=p?.image_url||'';
  $('prev').style.display=imgUrl?'block':'none'; $('prev').src=imgUrl; show('formOv');
}
$('addBtn').onclick=()=>openForm(null);
$('fSave').onclick=async()=>{
  const name=$('fName').value.trim(), catId=$('fCat').value||null; if(!name&&!catId){toast('جۆر هەڵبژێرە یان ناوێک بنووسە');return}
  $('fSave').disabled=true; $('fSave').textContent='...';
  try{
    let url=imgUrl;
    if(imgBlob){
      const path=crypto.randomUUID()+'.jpg';
      const up=await sb.storage.from('products').upload(path,imgBlob,{contentType:'image/jpeg'});
      if(up.error) throw up.error;
      url=sb.storage.from('products').getPublicUrl(path).data.publicUrl;
    }
    const row={name,category_id:catId,price:$('fPrice').value.trim(),description:$('fDesc').value.trim(),image_url:url};
    const r = editing ? await sb.from('products').update(row).eq('id',editing) : await sb.from('products').insert(row);
    if(r.error) throw r.error;
    hide('formOv'); await load(); toast('پاشەکەوت کرا ✓');
  }catch(e){toast('هەڵە: '+(e.message||'دووبارە هەوڵبدەرەوە'))}
  $('fSave').disabled=false; $('fSave').textContent='پاشەکەوتکردن';
};
async function del(id){
  if(!confirm('دڵنیایت لە سڕینەوەی ئەم بەرهەمە؟'))return;
  const {error}=await sb.from('products').delete().eq('id',id);
  if(error){toast('نەسڕایەوە');return} await load(); toast('سڕایەوە ✓');
}

// settings
$('setBtn').onclick=()=>{$('stName').value=settings.store_name;$('stSub').value=settings.store_sub||'';$('stWa').value=settings.whatsapp||'';show('setOv')};
$('stSave').onclick=async()=>{
  const row={id:1,store_name:$('stName').value.trim()||'Ramyar_Brand',store_sub:$('stSub').value.trim(),whatsapp:$('stWa').value.replace(/\D/g,'')};
  const {error}=await sb.from('settings').upsert(row);
  if(error){toast('پاشەکەوت نەکرا');return} settings=row; hide('setOv'); render(); toast('پاشەکەوت کرا ✓');
};

(async()=>{
  const {data}=await sb.auth.getSession(); if(data.session) setOwner(true);
  load();
})();
</script>
</body>
</html>
